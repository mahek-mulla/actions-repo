name: hello-workflow
env:
  APP_ENV: development
on: 
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building the project"
      - run: echo "build output" > build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.txt
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["16", "18", "20"]
    steps:
      - uses: actions/checkout@v4
      - run: echo "Running Tests ${{matrix.node-version }}"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: echo "Deploying $APP_ENV build"
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
      - run: cat build.txt